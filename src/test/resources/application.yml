spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: true   # 테스트에서 쿼리 수를 assert 하기 위해 켬
        session_factory:
          statement_inspector: com.dangdang.support.SqlCaptor   # 테스트에서 SQL 내용을 assert 하기 위해 등록

logging:
  level:
    com.dangdang: debug              # 우리 코드의 log.debug 출력
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.stat: warn
